<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fish.IO ΓÇö Mobile preview (dev)</title>
<style>
  body {
    margin: 0; background: #171b21; color: #cfd8e3;
    font-family: system-ui, sans-serif;
    display: flex; gap: 18px; padding: 14px; align-items: flex-start;
  }
  .frame { flex: 0 0 auto; }
  .label { font-size: 12px; margin-bottom: 6px; color: #7fb6dd; letter-spacing: .5px; }
  iframe { border: 2px solid #2c3742; border-radius: 14px; background: #000; display: block; }
  .hint { font-size: 12px; color: #6b7785; max-width: 260px; line-height: 1.6; }
  button {
    background: #1e88e5; color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="label">iPhone SE ┬╖ 375├ù667</div>
    <iframe id="f375" src="/index.html?v=3" width="375" height="667"></iframe>
  </div>
  <div class="frame">
    <div class="label">iPhone 12/13 ┬╖ 390├ù844</div>
    <iframe id="f390" src="/index.html?v=3" width="390" height="844"></iframe>
  </div>
  <div>
    <button onclick="startAll()">Γû╢ Start matches in both frames</button>
    <div class="hint">Dev-only page. Same-origin iframes run the real game at phone viewport sizes so responsive CSS can be verified without a device.</div>
  </div>
<script>
  window.startAll = function () {
    document.querySelectorAll('iframe').forEach((f) => {
      try {
        f.contentWindow.eval(
          "if (typeof game !== 'undefined' && game && game.gameState === 'menu') {" +
          "  game.startMatch('classic');" +
          "  if (game.player) game.player.invulnerableTimer = 999;" +
          "}"
        );
      } catch (e) { console.error(e); }
    });
  };
</script>
</body>
</html>
